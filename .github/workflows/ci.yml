name: spec-ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: spec-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validate checked-in schemas and examples
        run: python contracts/tools/validate_examples.py
      - name: Verify deterministic regeneration
        shell: bash
        run: |
          python contracts/tools/generate_contracts.py
          git diff --exit-code -- contracts
