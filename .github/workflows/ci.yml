name: spec-ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: spec-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
      - name: Install validator dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate checked-in schemas and examples
        run: python contracts/tools/validate_examples.py
      - name: Verify conformance harness
        run: python contracts/tools/conformance.py self-test
      - name: Verify independent Ajv conformance
        shell: bash
        run: |
          set -euo pipefail
          python contracts/tools/conformance.py emit > "$RUNNER_TEMP/proofdrift-vectors.jsonl"
          node contracts/tools/conformance_ajv.mjs "$RUNNER_TEMP/proofdrift-vectors.jsonl" > "$RUNNER_TEMP/proofdrift-ajv-results.jsonl"
          python contracts/tools/conformance.py score "$RUNNER_TEMP/proofdrift-ajv-results.jsonl" --require-perfect | tee "$RUNNER_TEMP/proofdrift-ajv-score.json"
      - name: Upload conformance evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spec-conformance-evidence
          path: |
            ${{ runner.temp }}/proofdrift-vectors.jsonl
            ${{ runner.temp }}/proofdrift-ajv-results.jsonl
            ${{ runner.temp }}/proofdrift-ajv-score.json
          if-no-files-found: error
          retention-days: 30
      - name: Verify normative semantic requirements
        run: python contracts/tools/validate_semantics.py
      - name: Validate normative conformance invariants
        run: python contracts/tools/validate_conformance.py
      - name: Verify security release gate
        shell: bash
        run: python contracts/tools/security_release_gate.py | tee "$RUNNER_TEMP/spec-security-release-evidence.json"
      - name: Upload security release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spec-security-release-evidence
          path: ${{ runner.temp }}/spec-security-release-evidence.json
          if-no-files-found: error
          retention-days: 30
      - name: Verify deterministic regeneration
        shell: bash
        run: |
          python contracts/tools/generate_contracts.py
          git diff --exit-code -- contracts
