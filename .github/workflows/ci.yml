name: spec-ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Validate checked-in schemas and examples
        run: python contracts/tools/validate_examples.py
      - name: Verify deterministic regeneration
        shell: bash
        run: |
          python contracts/tools/generate_contracts.py
          git diff --exit-code -- contracts
